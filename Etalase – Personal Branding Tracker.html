.small{font-size:13px}

.btn.soft{background:var(--glass-in);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{min-height:34px;padding:6px 14px;font-size:13px}

.link.red{color:#e5484d}

.ring{position:relative;width:132px;height:132px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--glass-in);box-shadow:inset 0 0 0 1px var(--line)}
.tip{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.tip:first-of-type{border-top:0}
.tip i{font-style:normal;font-weight:700;color:var(--accent);grid-row:span 2;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--glass-in);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.log{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.log span{min-width:0;overflow-wrap:anywhere}
.addlog{display:grid;grid-template-columns:130px 1fr auto;gap:8px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12.5px;font-weight:600;color:var(--muted)}

textarea{resize:vertical;min-height:80px;line-height:1.45}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.wide{grid-column:1/-1}
.row{border-radius:18px;padding:12px;background:var(--glass-in);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px}
.rh{display:flex;justify-content:space-between;align-items:center}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5}

.res{font-weight:600;color:var(--accent);font-size:13.5px}
